<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prevent Default - addEventListener()</title>
  </head>
  <body>
    <h1>Prevent Default</h1>

    <a href="https://www.hashtagtreinamentos.com/curso-javascript" id="meuLink">
      Clique aquie para ir até a página de Javascript da Hashtag!
    </a>

    <script>
      //Seleciona o elemento link (ancora)
      const meuLink = document.getElementById("meuLink");

      //Adicionar um evento de clique ao link
      meuLink.addEventListener("click", function (event) {
        event.preventDefault();

        console.log("O comportamento padrão do link foi prevenido");

        window.location.href = "https:www.google.com";
      });
    </script>
  </body>
</html>
